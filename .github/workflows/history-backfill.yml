name: History backfill

on:
  schedule:
    # Every 10 minutes while A-share users are typically active.
    - cron: "3,13,23,33,43,53 0-16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-radar-data-writer
  cancel-in-progress: false

jobs:
  history-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill missing daily history
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          SUPABASE_OWNER_ID: "${{ secrets.SUPABASE_OWNER_ID }}"
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_OWNER_ID"
          python scripts/market_close_job.py \
            --state data/state.json \
            --history-only \
            --history-days 60 \
            --supabase-url "$SUPABASE_URL" \
            --supabase-key "$SUPABASE_SERVICE_ROLE_KEY" \
            --supabase-owner-id "$SUPABASE_OWNER_ID"
